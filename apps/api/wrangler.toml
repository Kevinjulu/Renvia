name = "renvia-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "RENVIA_BUCKET"
bucket_name = "renvia-uploads"

# Secrets (DATABASE_URL, CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY, FAL_KEY,
# R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY) are set via `wrangler secret put <NAME>`, not committed here.
[vars]
R2_ACCOUNT_ID = ""
R2_BUCKET_NAME = "renvia-uploads"
R2_PUBLIC_BASE_URL = ""
# Comma-separated. Must include every studio/admin origin that calls the API
# (CORS + Clerk azp). Keep in sync with the Vercel ALLOWED_ORIGINS env var.
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:5174,https://renvia-studio.vercel.app,https://renvia-admin.vercel.app"
